[project]
name = "serve-search-service"
version = "0.1.0"
description = "Single-container search API for RAG workloads"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.141.1",
  "httpx>=0.27,<1",
  "opentelemetry-api>=1.0,<2",
  "opentelemetry-sdk>=1.0,<2",
  "pydantic==2.13.4",
  "pydantic-settings>=2.7,<3",
  "uvicorn[standard]==0.52.1",
]

[dependency-groups]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8,<10",
  "pytest-asyncio>=0.24,<2",
  "ruff==0.16.1",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/serve_search_service"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unused_ignores = true

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.coverage.run]
branch = true
source = ["serve_search_service"]
